services:
  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - 8100:80
    environment:
      - LOLMANTLE_CHAMPIONS=/data/champions.csv
      - LOLMANTLE_NAME_MAP=/data/name_map.csv
      - LOLMANTLE_PRODUCTION=True
      - LOLMANTLE_CORS_ORIGIN=http://yeardayhour.duckdns.org:3100
    volumes:
      - ./data:/data

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - 3100:3000
    environment:
      - NUXT_PUBLIC_API_CLIENT_BASE=http://yeardayhour.duckdns.org:8100
      - NUXT_PUBLIC_SPRITE_BASE=http://yeardayhour.duckdns.org:8101
      - NUXT_API_SERVER_BASE=http://backend:80

  sprite:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - 8101:80
    volumes:
      - "./images/nginx.conf:/etc/nginx/nginx.conf:ro"
      - "./images:/usr/share/nginx/html:ro"
