version: "3.9"
services:
  backend:
    build: ./backend
    ports:
      - 8000:80
    environment:
      - LOLMANTLE_CHAMPIONS=/data/champions.csv
      - LOLMANTLE_NAME_MAP=/data/name_map.csv
      - LOLMANTLE_PRODUCTION=True
      - LOLMANTLE_CORS_ORIGIN=http://localhost:3000
    volumes:
      - ./data:/data
  frontend:
    build: ./frontend
    ports:
      - 3000:80
    environment:
      - NUXT_PUBLIC_API_CLIENT_BASE=http://localhost:8000
      - NUXT_PUBLIC_SPRITE_BASE=http://localhost:8001
      - NUXT_API_SERVER_BASE=http://backend:80
      - LOLMANTLE_PRODUCTION=True

  sprite:
    image: nginx:alpine
    ports:
      - 8001:80
    restart: unless-stopped
    volumes:
      - "./images/nginx.conf:/etc/nginx/nginx.conf:ro"
      - "./images:/usr/share/nginx/html:ro"
